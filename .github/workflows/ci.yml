name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nodes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # n8n-workflow drags in isolated-vm, a native module needing a full C++
      # build. Only its type declarations are wanted here, so install scripts
      # are skipped rather than spending minutes compiling a VM.
      - name: Install (types only)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type-check
        run: npx tsc -p tsconfig.json --noEmit
      # rules.ts imports nothing from n8n, so it compiles and tests on its own.
      - name: Test rules
        run: npx tsc WorkflowGuard/rules.ts WorkflowGuard/rules.test.ts --target es2022 --module commonjs --esModuleInterop --outDir dist-test
      - name: Run tests
        run: node --test dist-test/rules.test.js
