name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nodes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # n8n-workflow drags in isolated-vm, a native module that needs a full
      # C++ build. Only its type declarations are wanted here, so the install
      # scripts are skipped rather than spending minutes compiling a VM.
      - name: Install (types only)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type-check
        run: npx tsc -p tsconfig.json --noEmit
      - name: Test rules
        run: |
          npx tsc rules.ts rules.test.ts \
            --target es2022 --module commonjs --esModuleInterop \
            --outDir ../dist-test
          node --test ../dist-test/
